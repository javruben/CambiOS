[package]
name = "cambios-net-probe"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "One-shot boot probe of net-stack's client surfaces (ep 21 UDP compatibility, ep 34 socket control) from the ADR-039 test-client endpoint 35."

[dependencies]
cambios-libsys = { path = "../libsys" }
cambios-libsys-rt = { path = "../libsys-rt" }
cambios-net-proto = { path = "../../cambios-net-proto" }
cambios-net-seam = { path = "../net-seam" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
panic = "abort"
