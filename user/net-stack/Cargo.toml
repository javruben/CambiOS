[package]
name = "cambios-net-stack"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The CambiOS network stack shell (ADR-039 section 1): owns the seam to the NIC driver and drives the cambios-netcore engine. The effects live here; the protocol lives in the engine."

[dependencies]
cambios-libsys = { path = "../libsys" }
cambios-libsys-rt = { path = "../libsys-rt", features = ["heap"] }
cambios-netcore = { path = "../../cambios-netcore" }
cambios-net-proto = { path = "../../cambios-net-proto" }
cambios-net-seam = { path = "../net-seam" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
panic = "abort"
